worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Server block to serve the React app and proxy API requests
    server {
        listen 80;
        server_name localhost;

        # Serve the files from the React app's build directory
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Serve the React app for any frontend routes
        location / {
            try_files $uri /index.html;
        }

        # Proxy /auth requests to the authentication backend on port 5003
        location /auth {
            proxy_pass http://host.docker.internal:5003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy /api requests to the main backend service on port 5002
        location /api {
            proxy_pass http://host.docker.internal:5002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
